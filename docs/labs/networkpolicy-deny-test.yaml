apiVersion: v1
kind: Pod
metadata:
  name: platformlab-netpol-deny-test
  namespace: default
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}

  nodeSelector:
    kubernetes.io/hostname: platformlab

  containers:
    - name: network-test
      image: busybox:1.36
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp

      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu

          HOST="platformlab-backend.platformlab-app.svc.cluster.local"

          echo "=== TEST 1: Kubernetes DNS ==="
          nslookup "$HOST"

          echo "=== TEST 2: Direct backend access ==="

          if wget -T 5 -O /tmp/response \
            "http://$HOST:3000/healthz"; then

            echo "FAIL: Unauthorized Pod reached backend"
            cat /tmp/response
            exit 1

          else
            echo "EXPECTED: Direct HTTP request failed"
          fi

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
