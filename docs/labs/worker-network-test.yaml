apiVersion: v1
kind: Pod
metadata:
  name: worker-network-test
  namespace: platformlab-app
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}
  nodeSelector:
    kubernetes.io/hostname: platformlab-m02
  containers:
    - name: network-test
      image: busybox:1.36
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "Testing Kubernetes DNS..."
          nslookup platformlab-backend.platformlab-app.svc.cluster.local

          echo "Testing cross-node HTTP..."
          wget -T 10 -qO- http://platformlab-backend.platformlab-app.svc.cluster.local:3000/healthz
          echo
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
