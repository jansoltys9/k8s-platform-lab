apiVersion: v1
kind: Pod
metadata:
  name: platformlab-netpol-same-ns-test
  namespace: platformlab-app
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}

  nodeSelector:
    kubernetes.io/hostname: platformlab-m02

  containers:
    - name: network-test
      image: busybox:1.36
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu

          BACKEND="platformlab-backend.platformlab-app.svc.cluster.local"
          FRONTEND="platformlab-frontend.platformlab-app.svc.cluster.local"

          echo "=== DNS ==="
          nslookup "$BACKEND"
          nslookup "$FRONTEND"

          echo "=== Backend access ==="
          if wget -T 5 -qO- "http://$BACKEND:3000/healthz"; then
            echo "FAIL: Backend unexpectedly reachable"
            exit 1
          else
            echo "EXPECTED: Backend blocked"
          fi

          echo "=== Frontend access ==="
          if wget -T 5 -qO- "http://$FRONTEND:8080/"; then
            echo "FAIL: Frontend unexpectedly reachable"
            exit 1
          else
            echo "EXPECTED: Frontend blocked"
          fi

          echo "Both negative tests completed"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
