name: PlatformLab - CI, Security, GHCR and GitOps

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - ".github/scripts/promote-images.py"
      - "gitops/**"
      - "platform/**"
      - "docs/labs/**"
      - "scripts/**"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    tags:
      - "backend-v*"
      - "frontend-v*"
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - ".github/scripts/promote-images.py"
      - "gitops/**"
      - "platform/**"
      - "docs/labs/**"
      - "scripts/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'platformlab-releases' || format('platformlab-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect application changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          base: ${{ github.ref }}
          filters: |
            app:
              - 'app/**'
            ci:
              - '.github/workflows/publish-images.yml'
              - '.github/scripts/promote-images.py'

  validate:
    name: Validate application and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Validate backend syntax
        run: node --check app/backend/server.js
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Audit frontend dependencies
        working-directory: app/frontend
        run: npm audit --audit-level=high
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - name: Lint, render and package chart
        run: |
          helm lint ./helm/platformlab
          helm template platformlab ./helm/platformlab \
            --namespace platformlab-app > /tmp/platformlab.yaml
          helm package ./helm/platformlab --destination /tmp

  security:
    name: Source security gates (Trivy, lint, Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trivy source, Kubernetes and Secrets scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: .local-secrets,app/frontend/node_modules
          format: json
          output: ${{ runner.temp }}/platformlab-source-trivy.json
          exit-code: '0'
      - name: Enforce source scan (sanitized counts only)
        shell: bash
        run: |
          python3 - <<'PYSCAN'
          import json
          import os
          import sys
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'platformlab-source-trivy.json'
          if not target.is_file():
              raise SystemExit('FAIL: missing Trivy JSON report')
          data = json.loads(target.read_text(encoding='utf-8'))
          if not isinstance(data.get('Results'), list):
              raise SystemExit('FAIL: invalid Trivy JSON report')
          high = 0
          fixable = 0
          secrets = 0
          misconfig = 0
          for result in data['Results']:
              for item in result.get('Vulnerabilities') or []:
                  if item.get('Severity') in ('HIGH', 'CRITICAL'):
                      high += 1
                      fixable += int(bool(item.get('FixedVersion')))
              secrets += len(result.get('Secrets') or [])
              misconfig += sum(
                  x.get('Severity') in ('HIGH', 'CRITICAL')
                  for x in result.get('Misconfigurations') or []
              )
          print(f'Trivy source: HIGH/CRITICAL={high}, fixable={fixable}, '
                f'secrets={secrets}, HIGH/CRITICAL misconfig={misconfig}')
          if fixable or secrets or misconfig:
              raise SystemExit('FAIL: source security gate')
          PYSCAN
      - name: Hadolint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in app/backend/Dockerfile app/frontend/Dockerfile; do
            docker run --rm -i ghcr.io/hadolint/hadolint:v2.15.1 < "$dockerfile"
          done
      - name: actionlint and embedded ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -f "$workflow" ]] || continue
            docker run --rm -i rhysd/actionlint:1.7.12 - < "$workflow"
          done
      - name: Gitleaks commit-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact=100 --no-banner --gitleaks-ignore-path /repo /repo
  release-meta:
    name: Validate component release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.tag.outputs.component }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse SemVer and verify released code is on main
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(backend|frontend)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected backend-vX.Y.Z or frontend-vX.Y.Z)" >&2
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          image_tag="${RELEASE_TAG#"$component"-}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must already be merged into main" >&2
            exit 1
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  scan:
    name: Trivy HIGH/CRITICAL - ${{ matrix.component }}
    needs: [validate, changes]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./app/backend
          - component: frontend
            context: ./app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: platformlab-${{ matrix.component }}:ci
      - name: Block on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: platformlab-${{ matrix.component }}:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish release to GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, security, scan, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tagged application source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish component SemVer image + SHA identity
        uses: docker/build-push-action@v7
        with:
          context: ./app/${{ needs.release-meta.outputs.component }}
          push: true
          platforms: linux/amd64
          sbom: true
          provenance: mode=min
          tags: |
            ghcr.io/${{ github.repository_owner }}/platformlab-${{ needs.release-meta.outputs.component }}:${{ needs.release-meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/platformlab-${{ needs.release-meta.outputs.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.image_tag }}

  promote-gitops:
    name: Promote released component to GitOps
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current GitOps main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - name: Set released component image tag
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_COMPONENT: ${{ needs.release-meta.outputs.component }}
          RELEASE_IMAGE_TAG: ${{ needs.release-meta.outputs.image_tag }}
        run: |
          python3 .github/scripts/promote-images.py \
            --owner "$IMAGE_OWNER" \
            --component "$RELEASE_COMPONENT" \
            --tag "$RELEASE_IMAGE_TAG"
          helm template platformlab ./helm/platformlab \
            --namespace platformlab-app > /tmp/platformlab.yaml
      - name: Commit image selection to GitOps
        env:
          RELEASE_COMPONENT: ${{ needs.release-meta.outputs.component }}
          RELEASE_IMAGE_TAG: ${{ needs.release-meta.outputs.image_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helm/platformlab/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): deploy $RELEASE_COMPONENT $RELEASE_IMAGE_TAG [skip ci]"
            git push origin HEAD:main
          fi
