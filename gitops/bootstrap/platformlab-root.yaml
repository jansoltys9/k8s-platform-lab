apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformlab-root
  namespace: argocd
spec:
  project: platformlab-management

  source:
    repoURL: https://github.com/jansoltys9/k8s-platform-lab.git
    targetRevision: main
    path: gitops/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
