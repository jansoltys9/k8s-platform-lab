apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformlab-secrets
  namespace: argocd
spec:
  project: platformlab-workloads

  source:
    repoURL: https://github.com/jansoltys9/k8s-platform-lab.git
    targetRevision: main
    path: gitops/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: platformlab-app
