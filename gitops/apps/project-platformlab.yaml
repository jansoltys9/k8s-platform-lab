apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platformlab-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  description: Restricted project for PlatformLab application

  sourceRepos:
    - https://github.com/jansoltys9/k8s-platform-lab.git

  destinations:
    - namespace: platformlab-app
      server: https://kubernetes.default.svc

  # The application must not manage cluster-wide resources.
  clusterResourceWhitelist: []

  # Application resources within the allowed namespace.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"