apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformlab-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platformlab-platform
  source:
    repoURL: https://github.com/jansoltys9/k8s-platform-lab.git
    targetRevision: main
    path: platform/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true