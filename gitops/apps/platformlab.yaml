apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformlab
  namespace: argocd
spec:
  project: platformlab-workloads

  source:
    repoURL: https://github.com/jansoltys9/k8s-platform-lab.git
    targetRevision: main
    path: helm/platformlab
    helm:
      releaseName: platformlab

  destination:
    server: https://kubernetes.default.svc
    namespace: platformlab-app

  ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas

  syncPolicy:
      automated:
        prune: false
        selfHeal: true
      syncOptions:
        - RespectIgnoreDifferences=true
