apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platformlab-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: PlatformLab App-of-Apps management

  sourceRepos:
    - https://github.com/jansoltys9/k8s-platform-lab.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd

  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
