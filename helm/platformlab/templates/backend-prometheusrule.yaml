{{- if .Values.observability.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    release: platformlab-monitoring
spec:
  groups:
    - name: platformlab.backend.availability
      rules:
        - alert: PlatformLabBackendScrapeDown
          expr: 'up{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-backend"} == 0'
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PlatformLab backend metrics scrape failed"
            description: "Prometheus cannot scrape the backend Service for at least one minute."
        - alert: PlatformLabBackendTargetMissing
          expr: 'absent(up{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-backend"})'
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "PlatformLab backend Prometheus target missing"
            description: "No backend scrape target has been discovered for at least one minute."
{{- end }}
